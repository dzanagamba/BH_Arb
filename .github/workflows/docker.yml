name: Docker

# The unit-test job stays fast. This optional job pays the Chromium build cost
# only when a deployment input changes, or when someone asks for it.
on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - requirements.txt
      - deploy/**
      - scripts/docker_smoke.py
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - requirements.txt
      - deploy/**
      - scripts/docker_smoke.py

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bh-arb:ci .

      - name: Smoke test (health, non-root, cache survives restart)
        run: python scripts/docker_smoke.py --no-build --image bh-arb:ci --port 18000
