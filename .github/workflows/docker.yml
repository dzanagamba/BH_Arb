name: Docker

# The unit-test job stays fast. This optional job pays the Chromium build cost
# only when a deployment input changes, or when someone asks for it.
on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - requirements.txt
      - requirements.lock
      - deploy/**
      - scripts/docker_smoke.py
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - requirements.txt
      - requirements.lock
      - deploy/**
      - scripts/docker_smoke.py

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build image (GHA layer cache restores the Chromium layer)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          load: true
          tags: bh-arb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for HIGH/CRITICAL OS and library CVEs
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: bh-arb:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Smoke test (health, non-root, Chromium, cache survives restart)
        run: python scripts/docker_smoke.py --no-build --image bh-arb:ci --port 18000
