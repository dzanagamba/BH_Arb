name: Docker

# The unit-test job stays fast. This optional job pays the Chromium build cost
# only when a deployment input changes, or when someone asks for it.
on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - requirements.txt
      - requirements.lock
      - deploy/**
      - scripts/docker_smoke.py
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - requirements.txt
      - requirements.lock
      - deploy/**
      - scripts/docker_smoke.py

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image (GHA layer cache restores the Chromium layer)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: bh-arb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for HIGH/CRITICAL OS and library CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: bh-arb:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Smoke test (health, non-root, Chromium, cache survives restart)
        run: python scripts/docker_smoke.py --no-build --image bh-arb:ci --port 18000
