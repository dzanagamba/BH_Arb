name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy .

      - name: Generated market doc is in sync
        run: python scripts/generate_market_mapping_doc.py --check

      # N3-2: a disappeared admitted family, a settlement change or a lowered
      # threshold fails here. The live bookmaker probe stays out of CI.
      - name: Sport/market admissibility audit
        run: python scripts/audit_admissibility.py --check

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the required runtime. 3.12 is the forward-compatibility check.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      # Node runs the shipped dashboard functions in tests/test_frontend_*.py.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      # N2-6: the frozen market fixtures and their dated parser contracts must
      # describe the same payload. A changed id/label/shape or an expired
      # capture fails here, before a live scan silently loses a market.
      - name: Parser contracts
        if: matrix.python-version == '3.11'
        run: python scripts/refresh_fixtures.py --check

      - name: Tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest --cov --cov-report=term-missing --cov-report=xml
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # N0-1: the same suite must pass when the redirected generated ledger
      # carries an accepted claim, as an operator's local ledger does.
      - name: Tests with a populated generated ledger
        if: matrix.python-version == '3.11'
        run: python -m pytest
        env:
          BH_ARB_TEST_RUNTIME_LEDGER: populated

      # N3-1: the opt-in load budgets are a separate step so the normal suite
      # stays fast. A material matcher/cache regression fails here.
      - name: Property load budgets
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/test_perf_budgets.py
        env:
          BH_ARB_TEST_SLOW: "1"

      - name: Tests
        if: matrix.python-version != '3.11'
        run: python -m pytest

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      - name: Dependency audit (runtime)
        run: python -m pip_audit -r requirements.lock --progress-spinner off

      - name: Dependency audit (dev)
        run: python -m pip_audit -r requirements-dev.lock --progress-spinner off

      - name: Static security scan (medium and above)
        run: python -m bandit -r engine server scrapers config models main.py scripts -ll -q

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      # The image installs requirements.lock, the resolved runtime set (27
      # packages). Install that exact file in a clean venv so the SBOM describes
      # the runtime set the image actually contains, not just the 8-line manifest.
      - name: Resolve the runtime environment
        run: |
          python -m venv .sbom-venv
          .sbom-venv/bin/pip install --disable-pip-version-check -q -r requirements.lock
          .sbom-venv/bin/pip freeze --all > sbom-requirements.txt

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements sbom-requirements.txt \
            --of JSON --output-reproducible -o sbom.cdx.json

      - name: Verify the SBOM covers the resolved runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("sbom.cdx.json").read_text(encoding="utf-8"))
          assert payload.get("bomFormat") == "CycloneDX"
          assert payload.get("specVersion")
          components = payload.get("components") or []
          names = {c.get("name", "").lower().replace("_", "-") for c in components}
          assert len(components) >= 27, f"SBOM has only {len(components)} components"
          for required in ("starlette", "pydantic-core"):
              assert required in names, f"SBOM is missing {required}"
          print(f"SBOM: {len(components)} components, spec {payload['specVersion']}")
          PY

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
