name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy .

      - name: Generated market doc is in sync
        run: python scripts/generate_market_mapping_doc.py --check

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the required runtime. 3.12 is the forward-compatibility check.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Node runs the shipped dashboard functions in tests/test_frontend_*.py.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest --cov --cov-report=term-missing --cov-report=xml
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # N0-1: the same suite must pass when the redirected generated ledger
      # carries an accepted claim, as an operator's local ledger does.
      - name: Tests with a populated generated ledger
        if: matrix.python-version == '3.11'
        run: python -m pytest
        env:
          BH_ARB_TEST_RUNTIME_LEDGER: populated

      - name: Tests
        if: matrix.python-version != '3.11'
        run: python -m pytest

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Dependency audit (runtime)
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Dependency audit (dev)
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off

      - name: Static security scan (medium and above)
        run: python -m bandit -r engine server scrapers config models main.py scripts -ll -q
