name: Browser checks

# SR4-8: the Chromium layer is opt-in, so the push CI stays fast. Run this
# workflow by hand after a Playwright bump, a browser-adapter change or a HAR
# fixture refresh. It never contacts a bookmaker: the HAR replays abort every
# request that is not in the committed file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Browser tests
        env:
          BH_ARB_TEST_BROWSER: "1"
        run: |
          python -m pytest \
            tests/test_page_fetch_browser.py \
            tests/test_browser_har_replay.py \
            tests/test_accessibility_axe.py \
            tests/test_browser_route_leak.py
