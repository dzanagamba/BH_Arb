name: Release

# Release-specific proof: the image builds, the container serves /api/health,
# and the SBOM is generated from the exact runtime lock the image installs. The
# normal CI still runs on the tag push; this workflow fails the release if the
# Docker smoke fails.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      # requirements.lock is the exact runtime set the image installs; install
      # it in a clean venv so the release artifact lists the same packages.
      - name: Resolve the runtime environment
        run: |
          python -m venv .sbom-venv
          .sbom-venv/bin/pip install --disable-pip-version-check -q -r requirements.lock
          .sbom-venv/bin/pip freeze --all > sbom-requirements.txt

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements sbom-requirements.txt \
            --of JSON --output-reproducible -o sbom.cdx.json

      - name: Verify the SBOM covers the resolved runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("sbom.cdx.json").read_text(encoding="utf-8"))
          assert payload.get("bomFormat") == "CycloneDX"
          assert payload.get("specVersion")
          components = payload.get("components") or []
          names = {c.get("name", "").lower().replace("_", "-") for c in components}
          assert len(components) >= 27, f"SBOM has only {len(components)} components"
          for required in ("starlette", "pydantic-core"):
              assert required in names, f"SBOM is missing {required}"
          print(f"SBOM: {len(components)} components, spec {payload['specVersion']}")
          PY

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build image (GHA layer cache restores the Chromium layer)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          load: true
          tags: bh-arb:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for HIGH/CRITICAL OS and library CVEs
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: bh-arb:release
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Smoke test (fails the release on health, non-root, Chromium or cache)
        run: python scripts/docker_smoke.py --no-build --image bh-arb:release --port 18001
