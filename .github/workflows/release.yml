name: Release

# Release-specific proof: the image builds, the container serves /api/health,
# and the SBOM is generated from the same requirements.txt the image installs.
# The normal CI still runs on the tag push; this workflow fails the release if
# the Docker smoke fails.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements requirements.txt \
            --of JSON --output-reproducible -o sbom.cdx.json

      - name: Verify the SBOM is a non-empty CycloneDX document
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("sbom.cdx.json").read_text(encoding="utf-8"))
          assert payload.get("bomFormat") == "CycloneDX"
          assert payload.get("specVersion")
          assert payload.get("components"), "SBOM has no components"
          print(f"SBOM: {len(payload['components'])} components, spec {payload['specVersion']}")
          PY

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (GHA layer cache restores the Chromium layer)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bh-arb:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (fails the release on a health/non-root failure)
        run: python scripts/docker_smoke.py --no-build --image bh-arb:release --port 18001
