version: 2
# Dependency updates stay reviewable: runtime and dev bumps are separate PRs,
# and every Dependabot PR runs the normal pull_request CI (quality, tests,
# security and SBOM). The Docker smoke stays path-triggered because the Chromium
# layer is the expensive part.
#
# GitHub Actions are pinned to commit SHAs with a `# vX.Y.Z` version comment;
# Dependabot's github-actions ecosystem rewrites both the SHA and that comment.
# The base image is pinned by tag + digest; the docker ecosystem advances the
# digest. Never replace either pin with a moving tag.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      runtime-dependencies:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "playwright"
          - "pydantic"
          - "rapidfuzz"
          - "httpx"
          - "python-dotenv"
          - "tzdata"
      dev-dependencies:
        patterns:
          - "pytest*"
          - "coverage"
          - "ruff"
          - "mypy"
          - "pip-audit"
          - "bandit"
          - "cyclonedx-bom"
          - "hypothesis"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
