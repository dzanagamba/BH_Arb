[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", ".venv", "cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines handled by formatter, not lint

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["venv/", "cache/"]

[tool.coverage.run]
# Application packages only: tests, operator scripts and generated runtime
# state would inflate or destabilise the number.
source = ["engine", "server", "scrapers", "config", "models"]
omit = ["config/generated/*"]
# M6-1: count each branch outcome, not just each line, so an untaken guard fails.
branch = true

[tool.coverage.report]
# M6-1: branch coverage measured 88.05% on 2026-11-11 on the 3.11 clean-mode
# suite (the populated-ledger run does not pass --cov). The floor is one point
# under so ordinary refactors do not turn CI red; raise it when coverage
# improves. Enforced only when pytest runs with --cov (the CI 3.11 leg).
fail_under = 87.05
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
