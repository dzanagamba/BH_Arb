[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", ".venv", "cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines handled by formatter, not lint

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["venv/", "cache/"]
